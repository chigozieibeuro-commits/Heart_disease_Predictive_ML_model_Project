services:
  app:
    build: .
    container_name: hearth_api
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    postgres: image:17
    container_name: heart_disease
    evn:
      POSTGRES_USER: postgres
      POSTGRES_DB: health_file
      POSTGRES_PASSWORD: password
    volumes: postgres_data:\var\lib\postgresql\data
volumes:
  postgres_data: