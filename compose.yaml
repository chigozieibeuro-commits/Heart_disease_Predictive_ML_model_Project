services:
  app:
    build: .
    container_name: heart_api
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: heart_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: heart
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - progres_data:/var/lib/postgresql/data
volumes:
  progres_data: